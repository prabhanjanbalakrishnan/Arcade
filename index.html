<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Side Quest Arcade</title>
<meta name="description" content="A growing collection of small browser games. Free to play, nothing to install.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ffd23f' d='M16 16 28 9A14 14 0 1 0 28 23Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: an arcade floor. A big marquee, then a row of cabinets, one per game. */
:root {
  color-scheme: dark;
  --bg: #1a0f2e;
  --panel: #251641;
  --screen: #0d0820;
  --ink: #f3ecff;
  --muted: #b3a4d6;
  --line: #4a3372;
  --sun: #ffd23f;
  --pink: #ff5fa8;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --pixel: "Silkscreen", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--pixel);
  font-size: 14px;
  line-height: 1.45;
  padding-block: 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { display: grid; gap: 40px; max-width: 980px; margin-inline: auto; }
header { display: grid; gap: 12px; }
h1 {
  margin: 0;
  font: 400 clamp(40px, 9vw, 84px)/0.98 var(--display);
  color: var(--sun);
  text-shadow: 4px 4px 0 var(--pink);
  text-wrap: balance;
}
header p { margin: 0; max-width: 46ch; font-size: 16px; color: var(--muted); }
.floor { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 24px; }
.cabinet {
  display: grid;
  grid-template-rows: auto 1fr;
  background: var(--panel);
  border: 3px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  color: inherit;
  text-decoration: none;
}
a.cabinet:hover { border-color: var(--sun); }
a.cabinet:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.cabinet svg { display: block; width: 100%; height: auto; background: var(--screen); }
.info { display: grid; gap: 8px; align-content: start; padding: 16px; }
.info h2 { margin: 0; font: 400 24px/1.1 var(--display); color: var(--sun); }
.info p { margin: 0; }
.best { color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { border-style: dashed; background: transparent; }
.empty .info h2 { color: var(--muted); }
.empty svg { background: transparent; }
.play { color: var(--pink); font-weight: 700; }
</style>

<main>
  <header>
    <h1>Side Quest Arcade</h1>
    <p>Small browser games, made while learning. Free to play, nothing to install.</p>
  </header>

  <section class="floor" aria-label="Games">
    <!-- To add a game: copy this whole <a> block, then change the link, name and description. -->
    <a class="cabinet" href="pellet-panic/" data-score-key="pellet-panic-hi">
      <svg viewBox="0 0 320 150" aria-hidden="true">
        <g fill="none" stroke="#6d5cff" stroke-width="4" stroke-linecap="round">
          <path d="M14 30H306M14 120H306"/>
        </g>
        <g fill="#ffe9b0">
          <circle cx="150" cy="75" r="4"/><circle cx="186" cy="75" r="4"/><circle cx="222" cy="75" r="4"/><circle cx="258" cy="75" r="4"/>
        </g>
        <path fill="#ffd23f" d="M108 75 134 58A30 30 0 1 0 134 92Z"/>
        <path fill="#ff5a4f" d="M272 104V72a22 22 0 0 1 44 0v32l-7-7-8 7-7-7-8 7-7-7z" transform="translate(-20 0)"/>
        <circle cx="264" cy="70" r="6" fill="#fff"/><circle cx="282" cy="70" r="6" fill="#fff"/>
        <circle cx="261" cy="71" r="3" fill="#1a1a55"/><circle cx="279" cy="71" r="3" fill="#1a1a55"/>
      </svg>
      <div class="info">
        <h2>Pellet Panic</h2>
        <p>Eat every pellet, dodge four spooks, and turn the tables with power pellets.</p>
        <p class="best" hidden></p>
        <p class="play">Play &rarr;</p>
      </div>
    </a>

    <div class="cabinet empty">
      <svg viewBox="0 0 320 150" aria-hidden="true">
        <text x="160" y="84" fill="#b3a4d6" font-family="Silkscreen, monospace" font-size="18" text-anchor="middle">INSERT COIN</text>
      </svg>
      <div class="info">
        <h2>Next game</h2>
        <p>Still being built. Check back soon.</p>
      </div>
    </div>
  </section>
</main>

<script>
// Shows your best score on each game's cabinet. Scores stay in your own browser.
document.querySelectorAll("[data-score-key]").forEach((card) => {
  let best = 0;
  try { best = Number(localStorage.getItem(card.dataset.scoreKey)) || 0; } catch {}
  if (!best) return;
  const line = card.querySelector(".best");
  line.textContent = `Your best: ${best}`;
  line.hidden = false;
});
</script>
